        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: true
        schema:
          type: string
          maxLength: 4096
      responses:
        '200':
          description: Immutable report bytes bound to the signed digest
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Invalid or expired capability
        '409':
          description: Integrity failure or missing bytes
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ArtifactCapability:
      type: apiKey
      in: query
      name: token
      description: Short-lived HMAC capability bound to tenant, report and digest; issued after report:read authorization.
  schemas:
    ImportBatch:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - source_label
      - file_sha256
      - currency
      - row_count
      - job_id
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        source_label:
          type: string
        file_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        row_count:
          type: integer
        job_id:
          type: string
          format: uuid
        profile_version:
          type: string
          minLength: 1
    ImportRow:
      type: object
      additionalProperties: false
      required:
      - id
      - batch_id
      - external_ref
      - currency
      - amount_minor
      - occurred_at
      - row_status
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        external_ref:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount_minor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        row_status:
          type: string
        transaction_type:
          type: string
          enum:
          - normal
          - refund
          - reversal
        row_number:
          type: integer
          minimum: 1
    ReconcileRun:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - left_batch_id
      - right_batch_id
      - rule_version
      - job_id
      - unmatched_count
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        left_batch_id:
          type: string
          format: uuid
        right_batch_id:
          type: string
          format: uuid
        rule_version:
          type: string
        job_id:
          type: string
          format: uuid
        unmatched_count:
          type: integer
        source_revision:
          type: string
          pattern: ^[0-9a-f]{64}$
        version:
          type: integer
          minimum: 1
    ExceptionCase:
      type: object
      additionalProperties: false
      required:
      - id
      - run_id
      - reason_code
      - left_transaction_id
      - right_transaction_id
      - status
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        reason_code:
          type: string
        left_transaction_id:
          type: [string, "null"]
          format: uuid
        right_transaction_id:
          type: [string, "null"]
          format: uuid
        status:
          type: string
        version:
          type: integer
          minimum: 1
        resolution_policy:
          type: string
          enum:
          - investigated
          - refund
          - reversal
    ExceptionResolution:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - exception_id
      - reviewer_id
      - decision
      - evidence_sha256
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        exception_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
        decision:
          type: string
        evidence_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    FinalizedReport:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - run_id
      - ledger_sha256
      - artifact_sha256
      - finalized_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        ledger_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        artifact_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        finalized_at:
          type: string
          format: date-time
        source_revision:
          type: string
          pattern: ^[0-9a-f]{64}$
        approved_summary_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        run_version:
          type: integer
          minimum: 1
        totals:
          $ref: '#/components/schemas/ReportTotals'
    SignedDownloadLink:
      type: object
      additionalProperties: false
      required:
      - report_id
      - expires_at
      - download_token
      properties:
        report_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        download_token:
          type: string
        source_revision:
          type: string
          pattern: ^[0-9a-f]{64}$
        totals:
          $ref: '#/components/schemas/ReportTotals'
        download_url:
          type: string
    ReportTotals:
      type: object
      additionalProperties: false
      required:
      - left_total_minor
      - right_total_minor
      - allocated_total_minor
      - allocated_left_total_minor
      - allocated_right_total_minor
      - source_unbalanced_minor
      - conservation_discrepancy_minor
      - matched_count
      - exception_count
      - open_exception_count
      - currency
      - proof
      properties:
        left_total_minor:
          type: integer
        right_total_minor:
          type: integer
        allocated_total_minor:
          type: integer
        allocated_left_total_minor:
          type: integer
        allocated_right_total_minor:
          type: integer
        source_unbalanced_minor:
          type: integer
        conservation_discrepancy_minor:
          type: integer
        left_row_count:
          type: integer
          minimum: 0
        right_row_count:
          type: integer
          minimum: 0
        matched_count:
          type: integer
          minimum: 0
        exception_count:
          type: integer
          minimum: 0
        open_exception_count:
          type: integer
          minimum: 0
        rejected_exception_count:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        proof:
          type: string
    CreateImportRequest:
      type: object
      additionalProperties: false
      required:
      - source_label
      - artifact_id
      - file_sha256
      - currency
      - profile_version
      properties:
        source_label:
          type: string
        artifact_id:
          type: string
          format: uuid
        file_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        profile_version:
          type: string
        csv_content:
          type: string
          maxLength: 2000000
    CreateReconcileRequest:
      type: object
      additionalProperties: false
      required:
      - left_batch_id
      - right_batch_id
      - rule_version
      properties:
        left_batch_id:
          type: string
          format: uuid
        right_batch_id:
          type: string
          format: uuid
        rule_version:
          type: string
    ResolveExceptionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - evidence_sha256
      - expected_version
      properties:
        decision:
          type: string
        evidence_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        expected_version:
          type: integer
    FinalizeRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - approved_summary_sha256
      properties:
        expected_version:
          type: integer
        approved_summary_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    ImportRowPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    ExceptionCasePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionCase'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    Problem:
      type: object
      description: RFC 9457 problem details, with stable application extension code and correlation request_id
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI; about:blank allowed
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        request_id:
          type: string
          minLength: 1
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: Resource version is stale
        code: STALE_VERSION
        request_id: request_example_001
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - filename
      - size_bytes
      - sha256
      properties:
        kind:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256: &id002
          type: string
          pattern: ^[0-9a-f]{64}$
        declared_media_type: &id003
          type: string
    UploadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - status
      - upload_url
      - expires_at
      - required_headers
      properties:
        artifact_id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
        upload_url:
          type: string
          format: uri
        expires_at: &id004
          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
    CommitUploadRequest:
      type: object
      additionalProperties: false
      required:
      - sha256
      - size_bytes
      - object_generation
      properties:
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 1
        object_generation:
          type: string
          minLength: 1
    ArtifactRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - kind
      - sha256
      - size_bytes
      - created_at
      properties:
        id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
          - QUARANTINED
          - VALIDATING
          - AVAILABLE
          - REJECTED
          - EXPIRED
          - DELETED
        kind: *id003
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 0
        created_at: *id004
        rejected_reason:
          type:
          - string
          - 'null'
    DownloadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - download_url
      - expires_at
      - object_generation
      properties:
        artifact_id: *id001
        download_url:
          type: string
          format: uri
        expires_at: *id004
        object_generation: *id003
    JobStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - state
      - created_at
      - state_version
      - attempt_count
      properties:
        id: *id001
        kind: *id003
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - WAITING_APPROVAL
          - SUCCEEDED
          - FAILED_RETRYABLE
          - FAILED_TERMINAL
          - CANCELLED
          - BLOCKED
          - RECONCILIATION_REQUIRED
        created_at: *id004
        state_version:
          type: integer
          minimum: 1
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
