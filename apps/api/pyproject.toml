[project]
name = "datareconcile-ai"
version = "0.1.0"
description = "Synthetic MVP for deterministic API change analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
