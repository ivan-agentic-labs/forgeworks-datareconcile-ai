[project]
name = "datareconcile-ai"
version = "0.1.0"
description = "Deterministic transaction reconciliation and signed reports"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.6", "psycopg_pool==3.3.3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2.13,<3", "jsonschema==4.26.0", "openapi-spec-validator==0.7.2", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

