name: Staging Candidate Live Revision Proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-candidate-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install verified runtime dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Verify HTTPS health, readiness, identity, anonymous access denial
        run: python scripts/probe_deployed_release.py --expected-revision "$GITHUB_SHA" --source-root .
