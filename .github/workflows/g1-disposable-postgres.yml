name: G1 Disposable PostgreSQL DDL Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ddl-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: g1_only_disposable_password
          POSTGRES_DB: forgeworks_g1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forgeworks_g1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      G1_DISPOSABLE_DB: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: g1_only_disposable_password
      PGDATABASE: forgeworks_g1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute DDL candidate on empty disposable database
        run: bash scripts/probe_disposable_postgres.sh
