name: Deployed Release Identity Proof
on:
  push:
    branches: [main]
    paths: [ops/releases/staging.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Verify fixed staging origin against reviewed release record
        run: python scripts/probe_deployed_release.py
