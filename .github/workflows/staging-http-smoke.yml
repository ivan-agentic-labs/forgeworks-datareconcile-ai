name: DataReconcile Staging Public Readiness
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/releases/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '23 1,7,13,19 * * *'
permissions:
  contents: read
jobs:
  staging-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public liveness and readiness without credentials
        env:
          BASE_URL: https://datareconcile-ai-staging.up.railway.app
        shell: bash
        run: |
          set -euo pipefail
          for item in "healthz ok" "readyz ready"; do
            read -r endpoint expected <<< "$item"
            printf 'Checking /%s\n' "$endpoint"
            curl --fail --silent --show-error --max-time 20 --connect-timeout 10 --retry 2 --max-filesize 4096 "$BASE_URL/$endpoint" |
              python -c 'import json,sys; expected=sys.argv[1]; obj=json.load(sys.stdin); assert isinstance(obj,dict) and obj.get("status")==expected, "Unexpected staging readiness state"' "$expected"
          done
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --connect-timeout 10 "$BASE_URL/v1/jobs/00000000-0000-0000-0000-000000000001")"
          if [[ "$status" != "401" ]]; then
            echo "Expected HTTP 401 for anonymous protected job read; received $status"
            exit 1
          fi
          echo "Anonymous protected-job read correctly denied (401)"
          for invalid_auth in "Bearer not-a-jwt" "Bearer eyJhbGciOiJub25lIn0.e30." "bearer invalid"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --connect-timeout 10 --header "Authorization: $invalid_auth" "$BASE_URL/v1/jobs/00000000-0000-0000-0000-000000000001")"
            if [[ "$status" != "401" ]]; then
              echo "Malformed or unsigned bearer token was not rejected (status: $status)"
              exit 1
            fi
          done
          echo "Malformed, unsigned and mis-cased bearer tokens denied (401)"
          curl --fail --silent --show-error --max-time 20 --connect-timeout 10 --max-filesize 4096 "$BASE_URL/v1/auth/config" |
            python -c 'import json,sys; x=json.load(sys.stdin); assert x.get("enabled") is True; assert x.get("product")=="datareconcile-ai"; assert x.get("environment")=="staging"; assert x.get("publishable_key","").startswith("sb_publishable_"); assert x.get("supabase_url","").startswith("https://"); assert x.get("supabase_url","").endswith(".supabase.co"), "Auth client config invalid"'
          echo "Public staging Auth client configuration validated; no token or credential was logged."
          echo "Public staging liveness/readiness response verified; this does not prove authenticated product acceptance."

      - name: Verify runtime identity and private metrics boundary
        env:
          BASE_URL: https://datareconcile-ai-staging.up.railway.app
          EXPECTED_PRODUCT: datareconcile-ai
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # On source pushes, fail closed until the new source SHA is deployed.
          # On scheduled or manual checks, compare the pinned staging release
          # because metadata-only commits deliberately do not redeploy.
          if [[ "$EVENT_NAME" == "push" ]]; then
            export EXPECTED_REVISION="$GITHUB_SHA"
          else
            export EXPECTED_REVISION="$(python -c 'import json,re; s=json.load(open("ops/releases/staging.json"))["revision_sha"]; assert re.fullmatch(r"[0-9a-f]{40}",s); print(s)')"
          fi
          current=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 8 --connect-timeout 5 --max-filesize 4096 "$BASE_URL/versionz" 2>/dev/null |
              python -c 'import json,os,re,sys; d=json.load(sys.stdin); m=d.get("runtime_manifest"); assert set(d)=={"product","environment","revision_sha","runtime_manifest"}; assert d["product"]==os.environ["EXPECTED_PRODUCT"] and d["environment"]=="staging"; assert d["revision_sha"]==os.environ["EXPECTED_REVISION"], "stale deployed revision"; assert isinstance(m,dict) and m.get("profile")=="forgeworks-runtime-manifest-v1"; assert type(m.get("file_count")) is int and 0<m["file_count"]<=256; assert re.fullmatch(r"[0-9a-f]{64}",m.get("sha256",""))' >/dev/null 2>&1; then
              current=1
              echo "Hosted /versionz matches expected revision (attempt $attempt)."
              break
            fi
            if [[ "$attempt" != "30" ]]; then sleep 6; fi
          done
          if [[ "$current" != "1" ]]; then
            echo "::error::Hosted staging failed to serve the expected revision after bounded retries."
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --connect-timeout 10 "$BASE_URL/metricsz")"
          if [[ "$status" != "401" ]]; then
            echo "Private metrics endpoint did not deny anonymous access (HTTP $status)"
            exit 1
          fi
          echo "Exact current GitHub revision and anonymous private metrics boundary passed."
