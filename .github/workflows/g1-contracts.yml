name: G1 Contract Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install -r scripts/requirements-verification.txt
      - name: Check bootstrap structure and sensitive content
        run: python scripts/verify_bootstrap.py
      - name: Validate SHA-bound evidence receipts
        run: python scripts/verify_evidence_receipts.py
      - name: Check contract shape and event schema
        run: python scripts/verify_contracts.py
      - name: Independent OpenAPI semantic validation
        run: python scripts/validate_openapi_independent.py
