name: DataReconcile PostgreSQL Runtime Proof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start fresh native PostgreSQL 17
        run: bash scripts/setup_disposable_postgres.sh runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'apps/api[test]' -r scripts/requirements-verification.txt
      - name: Run PostgreSQL import, exact reconciliation, report download, concurrency and RLS tests
        env:
          G1_DISPOSABLE_DB: 'yes'
          RECONCILE_DISPOSABLE_OWNER_DSN: 'host=127.0.0.1 port=5438 dbname=forgeworks_runtime user=postgres password=synthetic-disposable-ci-only'
        run: python -W error -m pytest tests/integration/test_postgres_runtime.py -q
      - name: Backup and restore fresh disposable database
        env:
          PGPASSWORD: synthetic-disposable-ci-only
        run: |
          /usr/lib/postgresql/17/bin/pg_dump -h 127.0.0.1 -p 5438 -U postgres -d forgeworks_runtime --format=custom > /tmp/forgeworks-runtime.dump
          /usr/lib/postgresql/17/bin/createdb -h 127.0.0.1 -p 5438 -U postgres forgeworks_restore
          /usr/lib/postgresql/17/bin/pg_restore -h 127.0.0.1 -p 5438 -U postgres -d forgeworks_restore --exit-on-error < /tmp/forgeworks-runtime.dump
      - name: Verify restored logical data and tenant policy
        env:
          G1_DISPOSABLE_DB: 'yes'
          FW_DISPOSABLE_OWNER_DSN: 'host=127.0.0.1 port=5438 dbname=forgeworks_runtime user=postgres password=synthetic-disposable-ci-only'
          FW_PRODUCT_MODULE: datareconcile_ai
        run: python scripts/verify_disposable_restore.py
      - name: Prove restored schema catalog drift is detected
        env:
          PGPASSWORD: synthetic-disposable-ci-only
          G1_DISPOSABLE_DB: 'yes'
          FW_DISPOSABLE_OWNER_DSN: 'host=127.0.0.1 port=5438 dbname=forgeworks_runtime user=postgres password=synthetic-disposable-ci-only'
          FW_PRODUCT_MODULE: datareconcile_ai
        run: |
          set -eu
          PSQL=/usr/lib/postgresql/17/bin/psql
          "$PSQL" -h 127.0.0.1 -p 5438 -U postgres -d forgeworks_restore -v ON_ERROR_STOP=1 -c 'CREATE INDEX fw_disposable_restore_drift_probe ON public.memberships (tenant_id)'
          if python scripts/verify_disposable_restore.py > /tmp/fw-restore-negative-check.log 2>&1; then
            echo 'ERROR: verifier accepted injected schema drift'
            exit 1
          fi
          grep -q 'RESTORED_SCHEMA_OBJECT_DRIFT' /tmp/fw-restore-negative-check.log
          "$PSQL" -h 127.0.0.1 -p 5438 -U postgres -d forgeworks_restore -v ON_ERROR_STOP=1 -c 'DROP INDEX public.fw_disposable_restore_drift_probe'
          python scripts/verify_disposable_restore.py
